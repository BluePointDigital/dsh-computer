# Public configuration only — credentials live in the Docker data volume.
# acme-dns v2.0.2 uses the sqlite driver name (v1 used sqlite3).
[general]
listen = "0.0.0.0:5353"
protocol = "both4"
domain = "auth.bluepointdigital.com"
nsname = "ns-acme.bluepointdigital.com"
nsadmin = "james.bluepointdigital.com"
records = [
  "auth.bluepointdigital.com. A 104.225.218.209",
  "auth.bluepointdigital.com. NS ns-acme.bluepointdigital.com.",
]
debug = false

[database]
engine = "sqlite"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "0.0.0.0"
port = "8080"
# Keep disabled except a coordinated, private operator enrollment window.
# NPM always denies /register publicly, including during that window.
disable_registration = true
# TLS terminates at NPM. The backend is never published on a host port.
tls = "none"
corsorigins = []
use_header = false

[logconfig]
loglevel = "warn"
logtype = "stdout"
logformat = "json"
